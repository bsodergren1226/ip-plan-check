
name: IP plan check

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build checker image
        run: docker build -t ipcheck .

      - name: Check the address plan
        id: check
        shell: bash
        run: |
          docker run --rm ipcheck > report.txt 2>&1
          result=$?
          cat report.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Open an issue with the report
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "IP plan check failed" \
            --body-file report.txt
